[package]
name = "motor-ecat"
version = "0.1.0"
edition = "2021"

[dependencies]
ea-proto = { path = "../ea-proto" }
ea-sysapi = { path = "../ea-sysapi" }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# 实时调度（SCHED_FIFO / 绑核 / mlock）只在 Linux 目标上可用。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
