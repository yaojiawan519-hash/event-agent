[package]
name = "ea-wasmapi"
version = "0.1.0"
edition = "2021"

# 独立于父 workspace：本 crate 仅面向 wasm32-wasip1（WasmEdge 的 WASI socket 扩展），
# 不能加入父 workspace 的原生构建。path 依赖仍指向父 workspace 里的 ea-proto。
[workspace]

[dependencies]
ea-proto = { path = "../ea-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasmedge_wasi_socket = "0.5"
