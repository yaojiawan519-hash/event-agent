[package]
name = "hw-temp"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
ea-proto = { path = "../ea-proto" }
ea-sysapi = { path = "../ea-sysapi" }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
